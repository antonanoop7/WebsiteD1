<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSC Mark and ATAR Calculators – Vertex Academics</title>
<meta name="description" content="Free HSC raw mark to HSC mark converter and ATAR calculator using UAC 2025 scaling data.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#DCE9F5;overflow-x:clip}
a{color:#0D2347}a:hover{color:#C41E24}
.field{font:inherit;font-size:1rem;color:#0D2347;background:#FFFFFF;border:1.5px solid #B7C3D8;border-radius:12px;padding:10px 12px;min-height:46px;box-sizing:border-box;width:100%}
.field:focus{outline:3px solid #9DB4E8;outline-offset:1px;border-color:#0D2347}
@keyframes rvUp{from{opacity:0;transform:translateY(64px)}to{opacity:1;transform:none}}
@keyframes heroOut{to{opacity:.1;transform:translateY(-90px)}}
@keyframes prog{to{transform:scaleX(1)}}
.progress{display:none}
@media (prefers-reduced-motion: no-preference){@supports (animation-timeline: view()){
.rv{animation:rvUp linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
.hero-out{animation:heroOut linear both;animation-timeline:view();animation-range:exit 0% exit 100%}
.progress{display:block;position:fixed;top:0;left:0;right:0;height:4px;transform-origin:0 50%;z-index:30;animation:prog linear both;animation-timeline:scroll(root)}
}}
</style>
</head>

function percentileFor(course, mark100) {
  var pts = [[0, 0], [100, 100]];
  var pcts = [25, 50, 75, 90, 99];
  for (var i = 0; i < 5; i++) pts.push([course.h[i] * 2, pcts[i]]);

}

function ordinal(n) {

}

function rawCurve(pts) {
  pts = pts.slice().sort(function (a, b) { return a[0] - b[0]; });
  var groups = [];
  pts.forEach(function (p) {
    var g = groups[groups.length - 1];
    if (g && g.x === p[0]) { g.sum += p[1]; g.n += 1; } else groups.push({ x: p[0], sum: p[1], n: 1 });
  });
  var st = [];
  groups.forEach(function (g) {
    st.push({ w: g.n, y: g.sum / g.n, xs: [g.x] });
    while (st.length > 1 && st[st.length - 2].y > st[st.length - 1].y) {
      var t = st.pop(), u = st.pop(), w = u.w + t.w;
      st.push({ w: w, y: (u.y * u.w + t.y * t.w) / w, xs: u.xs.concat(t.xs) });
    }
  });
  var curve = [[0, 0]];
  st.forEach(function (b) { b.xs.forEach(function (x) { curve.push([x, b.y]); }); });
  curve.push([100, 100]);
  return cleanPoints(curve);
}

function aggregateToAtar(agg) {
  var t = ATAR_TABLE, atar;
  if (agg >= t[t.length - 1][0]) atar = 99.95;
  else if (agg < t[0][0]) atar = t[0][1] - ((t[1][1] - t[0][1]) / (t[1][0] - t[0][0])) * (t[0][0] - agg);
  else atar = interp(t, agg);
  return Math.min(99.95, Math.floor(atar * 20 + 1e-9) / 20);
}

function hasExt2(rows) {
  return rows.some(function (r) { return r.course === "Mathematics Extension 2"; });
}

function unitsFor(c, ext2) {
  return c.name === "Mathematics Extension 1" && ext2 ? 2 : c.units;
}

function maxFor(c, ext2) {
  return unitsFor(c, ext2) === 1 ? 50 : 100;
}

function computeAtar(rows, errors) {
  var items = [], per = {}, ext2 = hasExt2(rows);
  rows.forEach(function (r, idx) {
    var c = findCourse(r.course), m = parseFloat(r.mark);
    if (!c || isNaN(m) || (errors && errors[idx].any)) return;
    m = Math.max(0, Math.min(100, m * 100 / maxFor(c, ext2)));
    var s = scaledPerUnit(c, m), units = unitsFor(c, ext2);
    per[idx] = { scaled: s, used: 0, units: units };
    for (var u = 0; u < units; u++) items.push({ idx: idx, v: s, english: c.english, catB: c.catB });
  });
  items.sort(function (a, b) { return b.v - a.v; });
  var chosen = [], catB = 0;
  var eng = items.filter(function (i) { return i.english; }).slice(0, 2);
  eng.forEach(function (i) { chosen.push(i); if (i.catB) catB++; });
  items.forEach(function (i) {
    if (chosen.length >= 10 || chosen.indexOf(i) >= 0) return;
    if (i.catB && catB >= 2) return;
    chosen.push(i); if (i.catB) catB++;
  });
  var agg = 0;
  chosen.forEach(function (i) { agg += i.v; per[i.idx].used += 1; });
  var ready = chosen.length >= 10 && eng.length >= 2;
  return { per: per, aggregate: agg, unitsCounted: chosen.length, totalUnits: items.length, englishUnits: eng.length, atar: ready ? aggregateToAtar(agg) : null };
}

function bandFor(mark, course) {
  if (course && course.extension) return mark >= 90 ? "E4" : mark >= 70 ? "E3" : mark >= 50 ? "E2" : "E1";
  return mark >= 90 ? "Band 6" : mark >= 80 ? "Band 5" : mark >= 70 ? "Band 4" : mark >= 60 ? "Band 3" : mark >= 50 ? "Band 2" : "Band 1";
}

var ERROR_RED = "#B42318";

function numberError(text, max, kind, wholeOnly) {
  var t = String(text == null ? "" : text).trim();
  if (t === "") return null;
  if (!/^-?\d*\.?\d+$/.test(t)) return "Enter your " + kind + " as a number from 0 to " + max + ".";
  var v = parseFloat(t);
  if (v < 0 || v > max) return "Your " + kind + " must be between 0 and " + max + ".";
  if (wholeOnly && v !== Math.floor(v)) return "HSC marks are whole numbers. Try " + Math.round(v) + ".";
  return null;
}

var PREREQS = {
  "English Extension 1": [["English Advanced"], "English Extension 1 needs English Advanced in your list."],
  "English Extension 2": [["English Extension 1"], "English Extension 2 needs English Extension 1 in your list."],
  "Mathematics Extension 1": [["Mathematics Advanced", "Mathematics Extension 2"], "Mathematics Extension 1 needs Mathematics Advanced or Extension 2 in your list."],
  "Mathematics Extension 2": [["Mathematics Extension 1"], "Mathematics Extension 2 needs Mathematics Extension 1 in your list."],
  "History Extension": [["Modern History", "Ancient History"], "History Extension needs Modern History or Ancient History in your list."],
  "Music Extension": [["Music 2"], "Music Extension needs Music 2 in your list."],
  "Science Extension": [["Biology", "Chemistry", "Physics", "Earth & Environmental Science", "Investigating Science"], "Science Extension needs a science course in your list."]
};

var ONE_OF = [
  [["English Standard", "English Advanced", "English EALD", "English Studies Exam"], "You can only take one of English Standard, Advanced, EAL/D or Studies."],
  [["Mathematics Standard 1 Exam", "Mathematics Standard 2", "Mathematics Advanced"], "You can only take one of Mathematics Standard 1, Standard 2 or Advanced."],
  [["Studies of Religion I", "Studies of Religion II"], "You can take Studies of Religion I or II, not both."]
];

function courseError(rows, i) {
  var name = rows[i].course;
  if (!name) return null;
  var names = rows.map(function (r) { return r.course; });
  var has = function (n) { return names.indexOf(n) >= 0; };
  if (names.indexOf(name) < i) return name + " is already in your list.";
  for (var g = 0; g < ONE_OF.length; g++) {
    var group = ONE_OF[g][0];
    if (group.indexOf(name) >= 0) {
      for (var j = 0; j < i; j++) if (group.indexOf(names[j]) >= 0) return ONE_OF[g][1];
    }
  }
  if (name === "Mathematics Advanced" && has("Mathematics Extension 2")) return "Extension 2 students don't get a Mathematics Advanced mark. Remove this subject.";
  if (/^Mathematics Standard/.test(name) && (has("Mathematics Extension 1") || has("Mathematics Extension 2"))) return "Mathematics Standard can't be taken with an Extension course.";
  var pre = PREREQS[name];
  if (pre && !pre[0].some(has)) return pre[1];
  var lang = name.match(/^(Arabic|Chinese|French|German|Indonesian|Italian|Japanese|Korean|Latin|Spanish) (Extension|Beginners|Continuers)$/);
  if (lang && lang[2] === "Extension" && !has(lang[1] + " Continuers")) return name + " needs " + lang[1] + " Continuers in your list.";
  if (lang && lang[2] === "Continuers" && has(lang[1] + " Beginners")) return "You can't take both " + lang[1] + " Beginners and Continuers.";
  return null;
}

function rowErrors(rows) {
  var ext2 = hasExt2(rows);
  return rows.map(function (r, i) {
    var c = findCourse(r.course);
    var hasMark = String(r.mark == null ? "" : r.mark).trim() !== "";
    var cErr = courseError(rows, i);
    var mErr = null;
    if (hasMark && !c) mErr = "Choose a subject for this mark.";
    else if (c && typeof r.pct !== "number") mErr = numberError(r.mark, maxFor(c, ext2), "mark", true);
    return { course: cErr, mark: mErr, any: !!(cErr || mErr) };
  });
}

var nextId = 1;
function newRow(course, mark) { nextId += 1; return { id: nextId, course: course || "", mark: mark === undefined ? "" : String(mark) }; }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      convSubject: "Mathematics Advanced",
      convYear: "all",
      convRaw: "",
      convAssess: "",
      rows: [newRow("English Advanced"), newRow("Mathematics Advanced"), newRow("Mathematics Extension 1"), newRow("Chemistry"), newRow("Physics"), newRow("Economics")]
    };
  }

  updateRow(id, patch) {
    this.setState({ rows: this.state.rows.map(function (r) { return r.id === id ? Object.assign({}, r, patch) : r; }) });
  }

  renderVals() {
    var self = this, st = this.state;

    var subjectData = RAW[st.convSubject] || {};
    var years = Object.keys(subjectData).filter(function (y) { return subjectData[y].length >= 1; }).sort().reverse();
    var countLabel = function (n) { return n + (n === 1 ? " mark" : " marks"); };
    var allCount = years.reduce(function (sum, y) { return sum + subjectData[y].length; }, 0);
    var yearOptions = [{ value: "all", label: "All years (" + countLabel(allCount) + ")" }].concat(years.map(function (y) { return { value: y, label: y + " (" + countLabel(subjectData[y].length) + ")" }; }));
    var convYear = st.convYear === "all" || years.indexOf(st.convYear) >= 0 ? st.convYear : "all";
    var pts = rawPoints(st.convSubject, convYear);
    var convRawError = numberError(st.convRaw, 100, "raw mark", false);
    var convAssessError = null;
    var convHasInput = String(st.convRaw).trim() !== "";
    var raw = parseFloat(st.convRaw), assess = NaN;
    var convReady = convHasInput && !convRawError && !convAssessError;
    var aligned = 0, hsc = 0, sparse = false;
    if (convReady) {
      raw = Math.max(0, Math.min(100, raw));
      aligned = Math.round(interp(rawCurve(pts), raw));
      hsc = isNaN(assess) ? aligned : Math.round((aligned + Math.max(0, Math.min(100, assess))) / 2);
      var minRaw = Math.min.apply(null, pts.map(function (p) { return p[0]; }));
      sparse = pts.length < 6 || raw < minRaw - 5;
    }
    var convCourse = findCourse(st.convSubject);

    var errors = rowErrors(st.rows);
    var anyRowError = errors.some(function (e) { return e.any; });
    var res = computeAtar(st.rows, errors);
    var ext2 = hasExt2(st.rows);
    var hasAdv = st.rows.some(function (r) { return r.course === "Mathematics Advanced"; });
    var rows = st.rows.map(function (r, idx) {
      var c = findCourse(r.course), p = res.per[idx], info;
      var units = c ? unitsFor(c, ext2) : 2;
      var unitLabel = units === 1 ? "1 unit · out of 50" : "2 units";
      if (!c) info = "";
      else if (!p) info = unitLabel;
      else info = unitLabel + (p.used === 0 ? " · not counted" : p.used < p.units ? " · " + p.used + " counted" : "");
      // Kept for reference, not displayed: what this subject adds to the aggregate out of 500.
      var aggregateContribution = p ? (p.scaled * p.used).toFixed(1) : null;
      var err = errors[idx];
      return {
        id: r.id, course: r.course, info: info, aggregateContribution: aggregateContribution,
        error: err.course || err.mark || "",
        hasError: err.any,
        noError: !err.any,
        courseInvalid: err.course ? "true" : "false",
        courseBorder: err.course ? ERROR_RED : "#B7C3D8",
        markInvalid: err.mark ? "true" : "false",
        markBorder: err.mark ? ERROR_RED : "#B7C3D8",
        mark: typeof r.pct === "number" && r.mark !== "" ? String(Math.round(parseFloat(r.mark))) : r.mark,
        max: String(units === 1 ? 50 : 100),
        setCourse: function (e) { self.updateRow(r.id, { course: e.target.value, pct: null }); },
        setMark: function (e) { self.updateRow(r.id, { mark: e.target.value, pct: null }); },
        remove: function () { self.setState({ rows: self.state.rows.filter(function (x) { return x.id !== r.id; }) }); }
      };
    });

    var breakdown = [];
    st.rows.forEach(function (r, idx) {
      var c = findCourse(r.course), entered = parseFloat(r.mark), p = res.per[idx];
      if (!c || isNaN(entered) || !p || errors[idx].any) return;
      var max = maxFor(c, ext2), factor = 100 / max;
      var m = Math.max(0, Math.min(100, entered * factor));
      var contrib = aggregateToAtar(scaledPerUnit(c, m) * 10);
      var counted = p.used === 0 ? "not counted" : p.used === p.units ? "counts " + p.used + (p.used === 1 ? " unit" : " units") : "counts " + p.used + " of " + p.units + " units";
      var status = "neutral";
      if (p.used === 0) status = "off";
      else if (res.atar !== null) {
        var diff = contrib - res.atar;
        status = diff >= 0 ? "up" : diff > -1.5 ? "steady" : "down";
      }
      var look = {
        up: { ring: "#1F9D55", text: "#15703C", bg: "#E3F5EA", label: "Boosting your ATAR" },
        steady: { ring: "#E0A400", text: "#7A5800", bg: "#FFF4D6", label: "Close to your ATAR" },
        down: { ring: "#D63B2F", text: "#A3241A", bg: "#FDE7E4", label: "Dragging your ATAR down" },
        off: { ring: "#9AA6BC", text: "#4A5573", bg: "#EEF1F6", label: "Not counted in your best 10 units" },
        neutral: { ring: "#2448C9", text: "#2448C9", bg: "#E8EDFC", label: "Add 10 units to compare" }
      }[status];
      var markNow = Math.round(entered);
      var pctNow = typeof r.pct === "number" ? r.pct : Math.round(percentileFor(c, m));
      var setTo = function (val) { self.updateRow(r.id, { mark: String(Math.max(0, Math.min(max, val))), pct: null }); };
      var setPct = function (target) {
        target = Math.max(0, Math.min(100, target));
        self.updateRow(r.id, { mark: String(Math.round(markForPercentile(c, target) / factor * 100) / 100), pct: target });
      };
      breakdown.push({
        key: r.id,
        name: c.name,
        mark: String(markNow),
        contribution: contrib < 30 ? "<30" : contrib.toFixed(2),
        band: bandFor(m, c),
        pct: ordinal(pctNow),
        pctDec: function () { setPct(pctNow - 1); },
        pctInc: function () { setPct(pctNow + 1); },
        dash: (Math.max(0, Math.min(100, contrib)) / 100 * 100.53).toFixed(1) + " 200",
        ringColor: look.ring,
        statusText: look.label,
        statusColor: look.text,
        statusBg: look.bg,
        dec: function () { setTo(markNow - 1); },
        inc: function () { setTo(markNow + 1); }
      });
    });

    var atarText = "—", atarNote = "", aggText = "—";
    if (anyRowError) {
      atarNote = "Fix the highlighted subjects to see your ATAR.";
    } else if (res.atar !== null) {
      atarText = res.atar < 30 ? "Below 30" : res.atar.toFixed(2);
      atarNote = "";
      aggText = res.aggregate.toFixed(1) + " / 500";
    } else if (res.englishUnits < 2) {
      atarNote = "Add an English course with a mark. Your ATAR needs at least 2 units of English.";
    } else {
      atarNote = "Add marks for at least 10 units. You have " + res.totalUnits + " so far.";
    }

    return {
      accent: this.props.accent ?? '#C41E24',
      rawSubjects: Object.keys(RAW).map(function (n) { return { name: n }; }),
      yearOptions: yearOptions,
      convSubject: st.convSubject,
      convYear: convYear,
      convRaw: st.convRaw,
      convAssess: st.convAssess,
      convReady: convReady,
      convEmpty: !convHasInput && !convAssessError,
      convBlocked: !!(convRawError || convAssessError),
      convRawError: convRawError || "",
      convRawHasError: !!convRawError,
      convRawInvalid: convRawError ? "true" : "false",
      convRawBorder: convRawError ? ERROR_RED : "#B7C3D8",
      convAssessError: convAssessError || "",
      convAssessHasError: !!convAssessError,
      convAssessInvalid: convAssessError ? "true" : "false",
      convAssessBorder: convAssessError ? ERROR_RED : "#B7C3D8",
      convAligned: String(aligned),
      convHsc: String(hsc),
      convBand: convCourse ? bandFor(hsc, convCourse) + " · " + ordinal(percentileFor(convCourse, hsc)) + " percentile" : "",
      convBasis: (isNaN(assess) ? "Assumes assessment matches exam" : "Exam and assessment averaged") + " · " + pts.length + " student marks",
      convSparse: convReady && sparse,
      setConvSubject: function (e) { self.setState({ convSubject: e.target.value, convYear: "all" }); },
      setConvYear: function (e) { self.setState({ convYear: e.target.value }); },
      setConvRaw: function (e) { self.setState({ convRaw: e.target.value }); },
      setConvAssess: function (e) { self.setState({ convAssess: e.target.value }); },
      addConvToAtar: function () {
        if (!convReady) return;
        var list = self.state.rows, found = false;
        var target = findCourse(st.convSubject);
        var value = target && maxFor(target, ext2) === 50 ? Math.round(hsc / 2) : hsc;
        var next = list.map(function (r) { if (!found && r.course === st.convSubject) { found = true; return Object.assign({}, r, { mark: String(value), pct: null }); } return r; });
        if (!found) next = next.concat([newRow(st.convSubject, value)]);
        self.setState({ rows: next });
      },
      courseOptions: COURSES.map(function (c) { return { name: c.name, label: c.name }; }),
      rows: rows,
      addRow: function () { self.setState({ rows: self.state.rows.concat([newRow()]) }); },
      atarText: atarText,
      atarNote: atarNote,
      aggText: aggText,
      breakdown: breakdown,
      hasBreakdown: breakdown.length > 0,
      unitsText: res.unitsCounted + " / 10 units"
    };
  }
}

htmPreact.render(html`<${Component} />`, document.getElementById('app'));
})();
</script>
</body>
</html>
